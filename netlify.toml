[build]
  command = "bun run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions configuration for TanStack Start SSR
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# Static assets - cache them
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    
